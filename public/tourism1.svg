<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2a3a"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="sun1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd39a"/>
      <stop offset="100%" stop-color="#ff9a5a"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#234d43"/>
      <stop offset="100%" stop-color="#123028"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6657"/>
      <stop offset="100%" stop-color="#173a30"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="#0b0e14"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="960" height="44" fill="#141920"/>
  <circle cx="24" cy="22" r="6" fill="#ff7b72"/>
  <circle cx="46" cy="22" r="6" fill="#ffcb6b"/>
  <circle cx="68" cy="22" r="6" fill="#7ee787"/>
  <rect x="100" y="12" width="420" height="20" rx="10" fill="#0b0e14"/>
  <text x="118" y="26" fill="#7d8590" font-size="12">thai-community-tourism.example</text>

  <!-- hero banner -->
  <rect x="0" y="44" width="960" height="280" fill="url(#sky1)"/>
  <circle cx="820" cy="110" r="46" fill="url(#sun1)" opacity="0.9"/>
  <polygon points="0,324 180,180 320,324" fill="url(#mtn1)"/>
  <polygon points="220,324 420,150 620,324" fill="url(#mtn2)"/>
  <polygon points="520,324 700,200 880,324" fill="url(#mtn1)"/>
  <rect x="0" y="300" width="960" height="24" fill="#0b0e14" opacity="0.35"/>

  <text x="60" y="150" fill="#f0f3f7" font-size="34" font-weight="700">เที่ยวชุมชน ทั่วไทย</text>
  <text x="60" y="182" fill="#e6f7f3" font-size="16">ค้นพบแหล่งท่องเที่ยวโดยชุมชน พร้อมเรื่องราวและวิถีชีวิตท้องถิ่น</text>

  <!-- search bar -->
  <rect x="60" y="220" width="520" height="48" rx="24" fill="#141920" stroke="#232a35"/>
  <circle cx="90" cy="244" r="7" fill="none" stroke="#5eead4" stroke-width="2"/>
  <line x1="95" y1="249" x2="102" y2="256" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <text x="116" y="250" fill="#7d8590" font-size="14">ค้นหาจังหวัด อำเภอ หรือหมู่บ้าน...</text>
  <rect x="440" y="228" width="120" height="32" rx="16" fill="#5eead4"/>
  <text x="500" y="249" fill="#0b0e14" font-size="13" font-weight="600" text-anchor="middle">ค้นหา</text>

  <!-- destination cards -->
  <g font-family="'Segoe UI', sans-serif">
    <rect x="60" y="360" width="260" height="180" rx="12" fill="#141920" stroke="#232a35"/>
    <rect x="60" y="360" width="260" height="110" rx="12" fill="#3a6b57"/>
    <rect x="60" y="360" width="260" height="110" fill="#3a6b57"/>
    <text x="80" y="492" fill="#f0f3f7" font-size="15" font-weight="600">บ้านริมคลอง</text>
    <text x="80" y="515" fill="#7d8590" font-size="12">ชุมชนท่องเที่ยวเชิงนิเวศ</text>

    <rect x="350" y="360" width="260" height="180" rx="12" fill="#141920" stroke="#232a35"/>
    <rect x="350" y="360" width="260" height="110" rx="12" fill="#c98a4b"/>
    <rect x="350" y="360" width="260" height="110" fill="#c98a4b"/>
    <text x="370" y="492" fill="#f0f3f7" font-size="15" font-weight="600">ตลาดโบราณริมน้ำ</text>
    <text x="370" y="515" fill="#7d8590" font-size="12">วิถีชีวิตและอาหารพื้นถิ่น</text>

    <rect x="640" y="360" width="260" height="180" rx="12" fill="#141920" stroke="#232a35"/>
    <rect x="640" y="360" width="260" height="110" rx="12" fill="#4a7fc9"/>
    <rect x="640" y="360" width="260" height="110" fill="#4a7fc9"/>
    <text x="660" y="492" fill="#f0f3f7" font-size="15" font-weight="600">หมู่บ้านชาวเล</text>
    <text x="660" y="515" fill="#7d8590" font-size="12">ทะเลใสและวัฒนธรรมประมง</text>
  </g>

  <text x="900" y="588" fill="#4a5262" font-size="11" text-anchor="end">mockup preview</text>
</svg>
