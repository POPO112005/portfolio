<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="banner3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6b57"/>
      <stop offset="100%" stop-color="#1d4437"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="#0b0e14"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="960" height="44" fill="#141920"/>
  <circle cx="24" cy="22" r="6" fill="#ff7b72"/>
  <circle cx="46" cy="22" r="6" fill="#ffcb6b"/>
  <circle cx="68" cy="22" r="6" fill="#7ee787"/>
  <rect x="100" y="12" width="420" height="20" rx="10" fill="#0b0e14"/>
  <text x="118" y="26" fill="#7d8590" font-size="12">thai-community-tourism.example/place/ban-rim-klong</text>

  <!-- hero photo banner -->
  <rect x="0" y="44" width="960" height="220" fill="url(#banner3)"/>
  <text x="60" y="150" fill="#ffffff" font-size="30" font-weight="700">บ้านริมคลอง</text>
  <text x="60" y="180" fill="#e6f7f3" font-size="14">ชุมชนท่องเที่ยวเชิงนิเวศ · จังหวัดเชียงใหม่</text>

  <!-- thumbnail strip -->
  <g>
    <rect x="60" y="284" width="140" height="90" rx="8" fill="#3a6b57"/>
    <rect x="210" y="284" width="140" height="90" rx="8" fill="#4a7fc9" opacity="0.85"/>
    <rect x="360" y="284" width="140" height="90" rx="8" fill="#c98a4b" opacity="0.85"/>
    <rect x="510" y="284" width="140" height="90" rx="8" fill="#8a63c9" opacity="0.85"/>
  </g>

  <!-- description -->
  <g fill="#7d8590" font-size="13">
    <rect x="60" y="404" width="560" height="10" rx="5" fill="#232a35"/>
    <rect x="60" y="426" width="520" height="10" rx="5" fill="#232a35"/>
    <rect x="60" y="448" width="480" height="10" rx="5" fill="#232a35"/>
    <rect x="60" y="470" width="360" height="10" rx="5" fill="#232a35"/>
  </g>

  <!-- info sidebar -->
  <rect x="660" y="284" width="240" height="230" rx="12" fill="#141920" stroke="#232a35"/>
  <text x="684" y="316" fill="#5eead4" font-size="13" font-weight="600">ข้อมูลการเดินทาง</text>
  <text x="684" y="346" fill="#7d8590" font-size="12">ที่อยู่</text>
  <text x="684" y="364" fill="#f0f3f7" font-size="12">ต.ริมคลอง อ.เมือง เชียงใหม่</text>
  <text x="684" y="392" fill="#7d8590" font-size="12">ค่าเข้าชม</text>
  <text x="684" y="410" fill="#f0f3f7" font-size="12">ฟรี</text>
  <rect x="684" y="440" width="192" height="52" rx="10" fill="#5eead4"/>
  <text x="780" y="472" fill="#0b0e14" font-size="13" font-weight="600" text-anchor="middle">ดูเส้นทาง</text>

  <text x="900" y="588" fill="#4a5262" font-size="11" text-anchor="end">mockup preview</text>
</svg>
